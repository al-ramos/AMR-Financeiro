name: CI — AMR Financeiro

on:
  push:
    branches: [ main, develop, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-backend:
    name: Build & Test .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore src/AMR.Financeiro.API/AMR.Financeiro.API.csproj

      - name: Build
        run: dotnet build src/AMR.Financeiro.API/AMR.Financeiro.API.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/AMR.Financeiro.Tests/AMR.Financeiro.Tests.csproj --configuration Release --verbosity normal

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (TypeScript + Vite)
        working-directory: frontend
        run: npm run build